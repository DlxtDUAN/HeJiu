<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>今晚，喝哪杯？</title>
<style>
:root{
  --cream:#f7efdc;
  --card:#fffaf0;
  --ink:#4a3f2f;
  --line:#ddcfae;
  --accent:#c98a4b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;overflow:hidden;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:var(--cream);color:var(--ink);
  user-select:none;
}

/* 格子笔记本背景 */
.paper{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(178,158,124,.30) 1px, transparent 1px),
    linear-gradient(90deg, rgba(178,158,124,.30) 1px, transparent 1px);
  background-size:28px 28px;
  background-position:-1px -1px;
}
.paper::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.55), rgba(255,255,255,0) 70%);
}

/* 标题 */
header{
  position:fixed;top:0;left:0;right:0;z-index:40;
  padding:16px 0 22px;
  text-align:center;
  font-family:"Kaiti SC","STKaiti","KaiTi",serif;
  font-size:24px;font-weight:700;letter-spacing:3px;
  color:#5b4632;
  background:linear-gradient(var(--cream) 62%, rgba(247,239,220,0));
  pointer-events:none;
}
header .sub{
  display:block;font-size:11px;letter-spacing:2px;color:#a3927a;
  font-family:system-ui,sans-serif;font-weight:400;margin-top:3px;
}

/* 牌堆 */
#deck{position:fixed;inset:0;z-index:10;}

.card{
  position:absolute;left:50%;top:50%;
  width:min(87vw,400px);
  height:min(72vh,620px);
  background:var(--card);
  border:2.5px solid var(--ink);
  border-radius:26px;
  box-shadow:0 16px 30px rgba(92,72,42,.16), 0 3px 0 rgba(255,255,255,.9) inset;
  overflow:hidden;
  transform:translate(-50%,-50%);
  transition:transform .42s cubic-bezier(.22,.9,.3,1.05), opacity .3s;
  will-change:transform;
  touch-action:none;
}
.card.slot-0{box-shadow:0 20px 38px rgba(92,72,42,.22), 0 3px 0 rgba(255,255,255,.9) inset;}

.art{
  position:absolute;left:0;right:0;top:0;
  height:calc(100% - 64px);
  display:flex;align-items:center;justify-content:center;
  padding:4px 6px 0;
  transition:height .45s cubic-bezier(.3,.9,.4,1);
}
.art svg{width:100%;height:100%;display:block;}

.name{
  position:absolute;left:0;right:0;height:64px;
  top:calc(100% - 64px);
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(#f6e8c9,#f1dfba);
  border-top:2.5px solid var(--ink);
  font-size:20px;font-weight:700;letter-spacing:2px;
  color:#4a3f2f;
  transition:top .45s cubic-bezier(.3,.9,.4,1);
  font-family:"Kaiti SC","STKaiti","KaiTi",serif;
}

.panel{
  position:absolute;left:0;right:0;
  top:calc(40% + 64px);bottom:0;
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;
  transition:opacity .3s .1s;
}
.ing-tip{
  flex:0 0 auto;
  text-align:center;
  font-size:11px;
  color:#b08a5a;
  letter-spacing:1px;
  padding:6px 0 2px;
}
.ing-list{
  flex:1;overflow-y:auto;padding:2px 18px 4px;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;
  scrollbar-width:none;
}
.ing-list::-webkit-scrollbar{display:none;}

.ing-row{
  display:flex;align-items:flex-start;gap:10px;
  padding:7px 0;
  border-bottom:1.5px dashed rgba(74,63,47,.18);
  opacity:0;transform:translateY(-8px);
  animation:slideIn .34s forwards;
}
@keyframes slideIn{to{opacity:1;transform:translateY(0);}}
.ing-ico{
  width:34px;height:34px;flex:0 0 34px;
  display:flex;align-items:center;justify-content:center;
  margin-top:2px;
}
.ing-ico svg{width:100%;height:100%;}
.ing-main{flex:1;min-width:0;}
.ing-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.ing-name{font-size:14.5px;color:#4a3f2f;}
.ing-amt{font-size:12.5px;color:#9a876b;font-family:ui-monospace,monospace;white-space:nowrap;}
.ing-alt{font-size:11px;color:#b08a5a;margin-top:2px;line-height:1.3;}

.make-btn{
  flex:0 0 auto;
  margin:6px auto 14px;
  padding:10px 30px;
  font-size:14.5px;letter-spacing:3px;font-weight:700;
  color:#fffaf0;background:#c98a4b;
  border:2.5px solid var(--ink);
  border-radius:99px;
  box-shadow:0 3px 0 var(--ink);
  font-family:inherit;cursor:pointer;
  transition:transform .12s, box-shadow .12s;
}
.make-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink);}

.card.expanded .art{height:40%;}
.card.expanded .name{top:40%;}
.card.expanded .panel{opacity:1;pointer-events:auto;}

/* 制作流程视图 */
#stepsView{
  position:fixed;inset:0;z-index:60;
  background:rgba(247,239,220,.98);
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;
  transition:opacity .3s;
}
#stepsView.show{opacity:1;pointer-events:auto;}

.prog-wrap{padding:26px 30px 6px;flex:0 0 auto;}
.prog-track{
  height:10px;border-radius:99px;background:#e8dcbe;
  border:2px solid var(--ink);overflow:hidden;
}
.prog-fill{
  height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#e8b673,#c98a4b);
  transition:width .38s cubic-bezier(.3,.9,.4,1);
}
.prog-label{
  text-align:center;font-size:12px;letter-spacing:2px;color:#a3927a;margin-top:8px;
}

#stepStage{
  flex:1;position:relative;display:flex;align-items:center;justify-content:center;
  touch-action:none;
}

.step-card{
  position:absolute;left:50%;top:50%;
  width:min(84vw,380px);
  min-height:min(46vh,340px);
  max-height:62vh;
  background:var(--card);
  border:2.5px solid var(--ink);
  border-radius:24px;
  box-shadow:0 16px 30px rgba(92,72,42,.16);
  padding:26px 24px;
  display:flex;flex-direction:column;
  transform:translate(-50%,-50%);
  transition:transform .36s cubic-bezier(.22,.9,.3,1.05), opacity .3s;
  overflow:hidden;
}
.step-badge{
  font-family:ui-monospace,monospace;
  font-size:12px;letter-spacing:3px;color:#c98a4b;
  margin-bottom:14px;font-weight:700;
}
.step-text{
  flex:1;font-size:17px;line-height:1.85;color:#4a3f2f;
  overflow-y:auto;
  font-family:"Kaiti SC","STKaiti","KaiTi",serif;
}
.step-dots{
  display:flex;gap:6px;justify-content:center;margin-top:16px;
}
.step-dots i{
  width:7px;height:7px;border-radius:99px;background:#e0d3b4;
  transition:background .3s,width .3s;
}
.step-dots i.on{background:#c98a4b;width:20px;}

.steps-hint{
  flex:0 0 auto;text-align:center;
  font-size:12px;color:#a3927a;letter-spacing:2px;
  padding:14px 0 26px;
}
.steps-close{
  position:absolute;top:20px;right:22px;
  width:34px;height:34px;border-radius:50%;
  border:2px solid var(--ink);background:var(--card);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;color:var(--ink);cursor:pointer;z-index:5;
  line-height:1;
}
</style>
</head>
<body>

<div class="paper"></div>

<header>
  今晚，喝哪杯？
  <span class="sub">上滑 / 下滑 换一杯</span>
</header>

<div id="deck"></div>

<div id="stepsView">
  <div class="prog-wrap">
    <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
    <div class="prog-label" id="progLabel">1 / 1</div>
  </div>
  <div id="stepStage"></div>
  <div class="steps-hint">← 左右滑动切换步骤 →</div>
  <div class="steps-close" id="closeSteps">✕</div>
</div>

<!-- 手绘滤镜 -->
<svg style="position:absolute;width:0;height:0" aria-hidden="true">
  <defs>
    <filter id="rough" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

function applySwaps(ingredients){
  return ingredients.map(ing=>{
    for(const s of SWAPS){
      if(s.match.test(ing.name)){
        let newName = s.name;
        let alt = s.alt || `原配方用${ing.name}`;
        if(s.amountNote) alt += `（${s.amountNote}）`;
        return {...ing, name:newName, alt};
      }
    }
    return ing;
  });
}

const COCKTAILS = RAW.trim().split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
  const p = line.split('|');
  const name = p[0].trim();
  const glass = (p[1]||'rocks').trim();
  const color = (p[2]||'#e8d8b0').trim();
  const deco = (p[3]||'').split(',').map(s=>s.trim()).filter(Boolean);
  let ingredients = (p[4]||'').split('~').filter(Boolean).map(s=>{
    const i = s.indexOf(':');
    if(i<0) return {name:s.trim(), amount:''};
    return {name:s.slice(0,i).trim(), amount:s.slice(i+1).trim()};
  });
  ingredients = applySwaps(ingredients);
  const steps = (p[5]||'').split('~').filter(Boolean).map(s=>s.trim());
  return {name, glass, color, deco, ingredients, steps};
});

function shade(hex, amt){
  let c = hex.replace('#','');
  if(c.length===3) c = c.split('').map(x=>x+x).join('');
  let r = parseInt(c.slice(0,2),16), g = parseInt(c.slice(2,4),16), b = parseInt(c.slice(4,6),16);
  r = Math.max(0,Math.min(255, Math.round(r + amt)));
  g = Math.max(0,Math.min(255, Math.round(g + amt)));
  b = Math.max(0,Math.min(255, Math.round(b + amt)));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function bubbles(x1,x2,y1,y2,color,n,seed){
  let s='';
  let r = seed;
  const rnd = ()=>{ r = (r*9301+49297)%233280; return r/233280; };
  for(let i=0;i<n;i++){
    const x = x1 + rnd()*(x2-x1);
    const y = y1 + rnd()*(y2-y1);
    const rad = 1.6 + rnd()*2.6;
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(1)}" fill="${color}" opacity=".65"/>`;
  }
  return s;
}

function iceCubes(seed){
  const arr = [
    {x:82,y:120,r:-12},{x:112,y:132,r:14},{x:96,y:148,r:6}
  ];
  return arr.map((c,i)=>`
    <rect x="${c.x}" y="${c.y}" width="26" height="24" rx="7"
      fill="rgba(255,255,255,.62)" stroke="#4a3f2f" stroke-width="2.2"
      transform="rotate(${c.r} ${c.x+13} ${c.y+12})"/>
  `).join('');
}

let artUid = 0;
function artSVG(co){
  const g = GLASSES[co.glass] || GLASSES.rocks;
  const uid = 'g'+(artUid++);
  const dark = shade(co.color,-38);
  const light = shade(co.color,36);
  const hasIce = ['rocks','highball','collins','tiki','hurricane','copper','wine'].includes(co.glass);
  const fizz = /苏打|汤力|可乐|姜汁|香槟|起泡|汽水/.test(co.ingredients.map(i=>i.name).join(''));

  let deco = '';
  (co.deco||[]).forEach((d,i)=>{
    const [rx,ry] = g.rim;
    deco += `<g transform="translate(${rx + (i*6) - 4},${ry - 4 + (i*4)})" filter="url(#rough)">${drawDeco(d)}</g>`;
  });

  return `
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${light}"/>
      <stop offset="55%" stop-color="${co.color}"/>
      <stop offset="100%" stop-color="${dark}"/>
    </linearGradient>
  </defs>

  <ellipse cx="100" cy="180" rx="46" ry="7" fill="rgba(92,72,42,.10)"/>

  <g filter="url(#rough)">
    <!-- 玻璃底色 -->
    <path d="${g.body}" fill="rgba(255,255,255,.55)" stroke="none"/>
    <!-- 液体 -->
    <path d="${g.liquid}" fill="url(#${uid})"/>
    ${hasIce ? iceCubes(3) : ''}
    ${fizz ? bubbles(80,120,90,160,'#ffffff',14, uid.length*37+11) : ''}
    <!-- 玻璃轮廓 -->
    <path d="${g.body}" fill="none" stroke="#4a3f2f" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${(g.extras||[]).map(e=>`<path d="${e}" fill="none" stroke="#4a3f2f" stroke-width="3.2" stroke-linecap="round"/>`).join('')}
  </g>

  <!-- 装饰 -->
  ${deco}
</svg>`;
}

  place: `<svg viewBox="0 0 64 64" style="height:100%;width:auto;display:block" xmlns="http://www.w3.org/2000/svg"><ellipse cx="32" cy="54" rx="18" ry="3" fill="rgba(92,72,42,.10)"/><path d="M20 24 L20 50 Q20 54 24 54 L40 54 Q44 54 44 50 L44 24 Z" fill="rgba(230,240,220,.5)" stroke="#4a3f2f" stroke-width="2.8" stroke-linejoin="round"/><circle cx="32" cy="16" r="6" fill="#d92b3a" stroke="#4a3f2f" stroke-width="2.2"/><path d="M32 10 Q34 4 40 3" stroke="#5a7a2a" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M32 30 L32 40 M32 44 L32 46" stroke="#c98a4b" stroke-width="3" stroke-linecap="round"/><path d="M28 38 L32 44 L36 38" stroke="#c98a4b" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  dflt: `<svg viewBox="0 0 64 64" style="height:100%;width:auto;display:block" xmlns="http://www.w3.org/2000/svg"><ellipse cx="32" cy="54" rx="18" ry="3" fill="rgba(92,72,42,.10)"/><path d="M18 24 L46 24 L32 44 Z" fill="rgba(230,240,220,.5)" stroke="#4a3f2f" stroke-width="2.8" stroke-linejoin="round"/><path d="M22 30 L42 30 L34 42 L30 42 Z" fill="#e0a13c"/><path d="M32 44 L32 52 M24 52 L40 52" stroke="#4a3f2f" stroke-width="2.6" stroke-linecap="round"/></svg>`
};

function iconForStep(text){
  if(/点火|点燃|燃烧/.test(text)) return STEP_ICONS.flame;
  if(/杯口|蘸|润湿|盐边|糖边|抹盐/.test(text)) return STEP_ICONS.rim;
  if(/装饰|放樱桃|放青柠|放柠檬|放橙|薄荷枝|放菠萝|放草莓|放荔枝|放水果|以.*饰/.test(text)) return STEP_ICONS.garnish;
  if(/苏打水|起泡|气泡|香槟|注满/.test(text)) return STEP_ICONS.fizz;
  if(/分层|沉底|浮上|浮一层|分两层/.test(text)) return STEP_ICONS.layer;
  if(/摇匀|摇壶|摇出|用力摇|干摇|再摇/.test(text)) return STEP_ICONS.shake;
  if(/搅拌|搅匀|轻搅|搅动/.test(text)) return STEP_ICONS.stir;
  if(/滤入|过滤|双重过滤|滤至/.test(text)) return STEP_ICONS.strain;
  if(/压碎|轻压|压出|压入/.test(text)) return STEP_ICONS.muddle;
  if(/挤|滴|油/.test(text)) return STEP_ICONS.squeeze;
  if(/加冰|碎冰|冰块|加满冰|填满碎冰|堆满碎冰/.test(text)) return STEP_ICONS.ice;
  if(/加热|热咖啡|热水|小火|趁热|温/.test(text)) return STEP_ICONS.heat;
  if(/放入|置于|加入|丢入/.test(text)) return STEP_ICONS.place;
  if(/倒入|注入|淋入|缓慢倒/.test(text)) return STEP_ICONS.pour;
  return STEP_ICONS.dflt;
}
/* ============================================================
   6. 卡牌堆
   ============================================================ */
const deck = document.getElementById('deck');
const stepsView = document.getElementById('stepsView');
const stepStage = document.getElementById('stepStage');
const progFill = document.getElementById('progFill');
const progLabel = document.getElementById('progLabel');

const SLOT = {
  '-1':{y:-160, s:0.86, o:0, z:1},
  '0': {y:0,    s:1,    o:1, z:50},
  '1': {y:16,   s:0.955,o:.92, z:40},
  '2': {y:30,   s:0.912,o:.62, z:30},
  '3': {y:42,   s:0.872,o:.34, z:20}
};

let cur = Math.floor(Math.random()*COCKTAILS.length);
const pool = new Map();   // index -> element
let view = 'deck';

function makeCardEl(idx){
  const co = COCKTAILS[idx];
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.idx = idx;

  const ingRows = co.ingredients.map((ing,i)=>`
    <div class="ing-row" style="animation-delay:${0.06*i + 0.08}s">
      <div class="ing-ico">${iconFor(ing.name)}</div>
      <div class="ing-main">
        <div class="ing-top">
          <span class="ing-name">${ing.name}</span>
          <span class="ing-amt">${ing.amount}</span>
        </div>
        ${ing.alt ? `<div class="ing-alt">平替：${ing.alt}</div>` : ''}
      </div>
    </div>
  `).join('');

  el.innerHTML = `
    <div class="art">${artSVG(co)}</div>
    <div class="name">${co.name}</div>
    <div class="panel">
      <div class="ing-tip">以下为日常食材平替版</div>
      <div class="ing-list">${ingRows}</div>
      <button class="make-btn">制作流程</button>
    </div>
  `;

  el.querySelector('.make-btn').addEventListener('click', e=>{
    e.stopPropagation();
    openSteps(co);
  });
  el.querySelector('.art').addEventListener('click', e=>{
    e.stopPropagation();
    toggleExpand(el);
  });

  return el;
}

function toggleExpand(el){
  if(view !== 'deck') return;
  el.classList.toggle('expanded');
}

function transformFor(slot){
  const s = SLOT[slot];
  return `translate(-50%,-50%) translateY(${s.y}px) scale(${s.s})`;
}

function layout(animate=true){
  for(let i=-1;i<=3;i++){
    const idx = cur + i;
    if(idx < 0 || idx >= COCKTAILS.length) continue;
    let el = pool.get(idx);
    if(!el){
      el = makeCardEl(idx);
      el.style.transition = 'none';
      el.style.transform = `translate(-50%,-50%) translateY(-70vh) scale(.9)`;
      el.style.opacity = '0';
      deck.appendChild(el);
      pool.set(idx, el);
      // 强制 reflow 后再动
      void el.offsetWidth;
      el.style.transition = animate ? '' : 'none';
    }
    const s = SLOT[String(i)];
    el.style.transform = transformFor(String(i));
    el.style.opacity = String(s.o);
    el.style.zIndex = String(s.z);
    el.style.pointerEvents = (i === 0) ? 'auto' : 'none';
  }
  // 清理超出范围的
  for(const [idx, el] of pool.entries()){
    if(idx < cur - 1 || idx > cur + 3){
      el.remove();
      pool.delete(idx);
    }
  }
}

function goNext(){
  if(cur >= COCKTAILS.length - 1) return;
  const oldEl = pool.get(cur);
  if(oldEl){
    oldEl.style.transform = `translate(-50%,-50%) translateY(-130vh) rotate(-12deg)`;
    oldEl.style.opacity = '0';
    oldEl.style.zIndex = '99';
    setTimeout(()=>{ oldEl.remove(); }, 440);
    pool.delete(cur);
  }
  cur++;
  layout();
}

function goPrev(){
  if(cur <= 0) return;
  const oldEl = pool.get(cur);
  if(oldEl){
    oldEl.style.transform = `translate(-50%,-50%) translateY(130vh) rotate(10deg)`;
    oldEl.style.opacity = '0';
    oldEl.style.zIndex = '99';
    setTimeout(()=>{ oldEl.remove(); }, 440);
    pool.delete(cur);
  }
  cur--;
  layout();
}

/* 手势：上下滑动 */
let drag = null;

deck.addEventListener('pointerdown', e=>{
  if(view !== 'deck') return;
  if(e.target.closest('.panel')) return;
  const card = e.target.closest('.card');
  if(!card || !card.classList.contains('card')) return;
  if(card !== pool.get(cur)) return;

  drag = {
    startY: e.clientY,
    startX: e.clientX,
    y: e.clientY,
    moved: false,
    el: card
  };
  card.style.transition = 'none';
  card.setPointerCapture && card.setPointerCapture(e.pointerId);
});

deck.addEventListener('pointermove', e=>{
  if(!drag) return;
  const dy = e.clientY - drag.startY;
  const dx = e.clientX - drag.startX;
  if(!drag.moved && Math.abs(dy) > 7 && Math.abs(dy) > Math.abs(dx)){
    drag.moved = true;
  }
  if(drag.moved){
    drag.el.style.transform =
      `translate(-50%,-50%) translateY(${dy}px) rotate(${(dy*0.018).toFixed(2)}deg)`;
    drag.el.style.opacity = String(Math.max(0.35, 1 - Math.abs(dy)/500));
  }
});

deck.addEventListener('pointerup', e=>{
  if(!drag) return;
  const dy = e.clientY - drag.startY;
  const el = drag.el;
  el.style.transition = '';

  if(drag.moved && Math.abs(dy) > 70){
    if(dy < 0) goNext();
    else goPrev();
  }else{
    el.style.transform = transformFor('0');
    el.style.opacity = '1';
  }
  drag = null;
});

deck.addEventListener('pointercancel', ()=>{
  if(drag){
    drag.el.style.transition = '';
    drag.el.style.transform = transformFor('0');
    drag.el.style.opacity = '1';
    drag = null;
  }
});

/* ============================================================
   7. 制作流程视图
   ============================================================ */
let stepCo = null, stepIdx = 0, stepEl = null;

function openSteps(co){
  if(!co.steps || !co.steps.length) return;
  stepCo = co;
  stepIdx = 0;
  view = 'steps';
  stepsView.classList.add('show');
  renderStep(true);
}

function closeSteps(){
  stepsView.classList.remove('show');
  view = 'deck';
  stepStage.innerHTML = '';
  stepEl = null;
}

document.getElementById('closeSteps').addEventListener('click', closeSteps);

function renderStep(isFirst){
  const total = stepCo.steps.length;
  progFill.style.width = ((stepIdx+1)/total*100) + '%';
  progLabel.textContent = (stepIdx+1) + ' / ' + total;

  if(stepEl) stepEl.remove();

  const stepText = stepCo.steps[stepIdx];
  const el = document.createElement('div');
  el.className = 'step-card';
  el.style.transition = 'none';
  el.style.transform = `translate(-50%,-50%) translateY(30px) scale(.94)`;
  el.style.opacity = '0';
  el.innerHTML = `
    <div class="step-badge">STEP ${String(stepIdx+1).padStart(2,'0')}</div>
    <div style="flex:0 0 auto;height:90px;display:flex;align-items:center;justify-content:center;margin:0 0 10px;opacity:.92;">${iconForStep(stepText)}</div>
    <div class="step-text">${stepText}</div>
    <div class="step-dots">
      ${stepCo.steps.map((_,i)=>`<i class="${i===stepIdx?'on':''}"></i>`).join('')}
    </div>
  `;
  stepStage.appendChild(el);
  stepEl = el;
  void el.offsetWidth;
  el.style.transition = '';
  el.style.transform = `translate(-50%,-50%)`;
  el.style.opacity = '1';
}
/* 左右滑动 */
let sdrag = null;

stepStage.addEventListener('pointerdown', e=>{
  if(view !== 'steps') return;
  sdrag = {startX:e.clientX, startY:e.clientY, x:e.clientX, moved:false};
  stepStage.setPointerCapture && stepStage.setPointerCapture(e.pointerId);
});

stepStage.addEventListener('pointermove', e=>{
  if(!sdrag || !stepEl) return;
  const dx = e.clientX - sdrag.startX;
  const dy = e.clientY - sdrag.startY;
  if(!sdrag.moved && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){
    sdrag.moved = true;
    stepEl.style.transition = 'none';
  }
  if(sdrag.moved){
    stepEl.style.transform = `translate(-50%,-50%) translateX(${dx}px) rotate(${(dx*0.012).toFixed(2)}deg)`;
    stepEl.style.opacity = String(Math.max(0.3, 1 - Math.abs(dx)/420));
  }
});

stepStage.addEventListener('pointerup', e=>{
  if(!sdrag) return;
  const dx = e.clientX - sdrag.startX;
  if(stepEl) stepEl.style.transition = '';

  if(sdrag.moved && Math.abs(dx) > 65){
    if(dx < 0){
      // 下一步
      if(stepIdx >= stepCo.steps.length - 1){
        // 最后一页再翻 → 回主页面
        if(stepEl){
          stepEl.style.transform = `translate(-50%,-50%) translateX(-140%) rotate(-10deg)`;
          stepEl.style.opacity = '0';
        }
        setTimeout(closeSteps, 280);
      }else{
        if(stepEl){
          stepEl.style.transform = `translate(-50%,-50%) translateX(-140%) rotate(-10deg)`;
          stepEl.style.opacity = '0';
        }
        const old = stepEl;
        stepEl = null;
        setTimeout(()=>{ if(old) old.remove(); }, 340);
        stepIdx++;
        progFill.style.width = ((stepIdx+1)/stepCo.steps.length*100)+'%';
        progLabel.textContent = (stepIdx+1)+' / '+stepCo.steps.length;
        setTimeout(()=>renderStep(false), 120);
      }
    }else{
      // 上一步
      if(stepIdx > 0){
        if(stepEl){
          stepEl.style.transform = `translate(-50%,-50%) translateX(140%) rotate(10deg)`;
          stepEl.style.opacity = '0';
        }
        const old = stepEl;
        stepEl = null;
        setTimeout(()=>{ if(old) old.remove(); }, 340);
        stepIdx--;
        progFill.style.width = ((stepIdx+1)/stepCo.steps.length*100)+'%';
        progLabel.textContent = (stepIdx+1)+' / '+stepCo.steps.length;
        setTimeout(()=>renderStep(false), 120);
      }else{
        stepEl.style.transform = `translate(-50%,-50%)`;
        stepEl.style.opacity = '1';
      }
    }
  }else{
    if(stepEl){
      stepEl.style.transform = `translate(-50%,-50%)`;
      stepEl.style.opacity = '1';
    }
  }
  sdrag = null;
});

stepStage.addEventListener('pointercancel', ()=>{
  if(stepEl){
    stepEl.style.transition = '';
    stepEl.style.transform = `translate(-50%,-50%)`;
    stepEl.style.opacity = '1';
  }
  sdrag = null;
});

/* ============================================================
   8. 启动
   ============================================================ */
layout(false);
</script>
